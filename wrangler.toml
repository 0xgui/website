name = "rss-worker"
main = "worker.js"
compatibility_date = "2024-01-01"
# Custom-domain routes turn workers.dev off unless this is set. The mirror
# prefers that host because the silvags.com zone's bot settings do not apply.
workers_dev = true

routes = [
  { pattern = "rss.silvags.com", custom_domain = true }
]

[triggers]
crons = ["17 * * * *"]

[[kv_namespaces]]
binding = "SNAPSHOT"
id = "343495711abd4d8cb8c4b7946afc0c33"
