name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Markdown negotiation tests
        run: node --test tests/negotiate.test.mjs
